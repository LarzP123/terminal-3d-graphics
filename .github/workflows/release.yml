name: Release (Tag-based)

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Check tag matches cabal version
        run: |
          CABAL_VERSION=$(grep -i '^version:' terminal-3d-graphics.cabal | awk '{print $2}')
          echo "Tag: $TAG  |  Cabal version: $CABAL_VERSION"
          if [ "v$CABAL_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match cabal version v$CABAL_VERSION"
            exit 1
          fi

  release:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10"
          cabal-version: "latest"

      - name: Cache Cabal
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project*') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Update package index
        run: cabal update

      - name: Build project
        run: cabal build all

      # -------------------------
      # Stage Linux
      # -------------------------
      - name: Stage Linux release
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp $(cabal list-bin exe:t3d) release/t3d
          cp -r textures release/

      # -------------------------
      # Stage Windows
      # -------------------------
      - name: Stage Windows release
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item (cabal list-bin exe:t3d) release\t3d.exe
          Copy-Item -Recurse textures release\textures

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-release
          path: release/

  publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Linux-release
          path: linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-release
          path: windows

      - name: Package Linux
        run: |
          cd linux
          zip -r ../t3d-linux.zip .

      - name: Package Windows
        run: |
          cd windows
          zip -r ../t3d-windows.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            t3d-linux.zip
            t3d-windows.zip